<!doctype html>
<!-- App Store marketing screenshot (iPhone 6.3", 1206x2622).
     Params: ?shot=home&lang=pt-BR  — rendered by screenshot/template/render.sh -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1206px; height: 2622px; overflow: hidden; }
  body {
    background: #0d0d0d;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    color: #fff;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 2px, transparent 2px),
      linear-gradient(90deg, rgba(255,255,255,.035) 2px, transparent 2px);
    background-size: 84px 84px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 30%, transparent 85%);
  }
  .glow {
    position: absolute; left: 50%; top: 1500px; width: 1300px; height: 1300px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--glow) 0%, transparent 62%);
  }
  .copy { position: absolute; top: 150px; left: 0; right: 0; text-align: center; padding: 0 70px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 14px;
    font-size: 34px; font-weight: 700; letter-spacing: .2em;
    color: #fff; background: rgba(255,255,255,.08);
    border: 2px solid rgba(255,255,255,.12);
    padding: 16px 34px; border-radius: 999px;
  }
  .eyebrow .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
  h1, h2 { white-space: nowrap; }
  h1 { margin-top: 52px; font-size: 104px; line-height: 1.1; font-weight: 800; letter-spacing: -.035em; }
  h2 { margin-top: 18px; font-size: 64px; line-height: 1.15; font-weight: 600; letter-spacing: -.02em; color: #8b8b90; }
  .phone {
    position: absolute; left: 50%; top: 610px; transform: translateX(-50%);
    width: 900px; padding: 18px;
    background: linear-gradient(160deg, #3a3a3e, #1c1c1f 40%, #2b2b2f);
    border-radius: 132px;
    box-shadow: 0 0 0 3px #48484d, 0 60px 140px rgba(0,0,0,.7);
  }
  .screen { position: relative; border-radius: 114px; overflow: hidden; background: #000; }
  .screen img { display: block; width: 864px; }
  .island {
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    width: 250px; height: 74px; border-radius: 40px; background: #000;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="copy">
    <div class="eyebrow"><span class="dot"></span><span id="eyebrow"></span></div>
    <h1 id="l1"></h1>
    <h2 id="l2"></h2>
  </div>
  <div class="phone"><div class="screen"><img id="shot"><div class="island"></div></div></div>
<script>
  const copy = {
    home: { accent: "#3b82f6", glow: "rgba(59,130,246,.16)",
      "pt-BR": ["TABNEWS NO IPHONE", "Seu feed dev.", "Nativo no iPhone."],
      en: ["TABNEWS ON IPHONE", "Your dev feed.", "Native on iPhone."] },
    post: { accent: "#d4d63a", glow: "rgba(212,214,58,.10)",
      "pt-BR": ["LEITURA", "Leia com calma.", "Destaque o que importa."],
      en: ["READING", "Read at your pace.", "Highlight what matters."] },
    game: { accent: "#a855f7", glow: "rgba(168,85,247,.18)",
      "pt-BR": ["JOGOS DEV", "Jogue nos intervalos.", "Desafios novos todo dia."],
      en: ["DEV GAMES", "Play on your breaks.", "New challenges every day."] },
    bigo: { accent: "#6366f1", glow: "rgba(99,102,241,.18)",
      "pt-BR": ["BIG O", "Qual a complexidade?", "Acerte o Big O do código."],
      en: ["BIG O", "What's the complexity?", "Spot the Big O of real code."] },
    leetcode: { accent: "#f97316", glow: "rgba(249,115,22,.14)",
      "pt-BR": ["DEVLEET", "Papel e caneta.", "Um desafio por semana."],
      en: ["DEVLEET", "Pen and paper.", "One challenge every week."] },
    newsletter: { accent: "#3b82f6", glow: "rgba(59,130,246,.14)",
      "pt-BR": ["NEWSLETTER", "Fique por dentro.", "As novidades de tech do dia."],
      en: ["NEWSLETTER", "Stay in the loop.", "Today's tech news, in one place."] },
  };
  const p = new URLSearchParams(location.search);
  const shot = p.get("shot") || "home", lang = p.get("lang") || "pt-BR";
  const c = copy[shot];
  document.body.style.setProperty("--accent", c.accent);
  document.body.style.setProperty("--glow", c.glow);
  [eyebrow.textContent, l1.textContent, l2.textContent] = c[lang];
  // Shrink each line until it fits the copy width.
  for (const el of [l1, l2]) {
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > 1066 && size > 40) el.style.fontSize = `${--size}px`;
  }
  document.getElementById("shot").src = `../../docs/screenshots/news-${shot}.png`;
</script>
</body>
</html>
